name: Portable rules and project consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - name: Check project wiring
        run: python3 Scripts/check_project.py
      - name: Compile and run shared gameplay rules
        run: python3 Scripts/run_rules_tests.py
      - name: Check undefined behavior in shared rules
        run: python3 Scripts/run_rules_tests.py --sanitize
      - name: Compile and run camera and effect presentation rules
        run: python3 Scripts/run_presentation_tests.py
      - name: Check undefined behavior in presentation rules
        run: python3 Scripts/run_presentation_tests.py --sanitize
      - name: Compile and run AI companion rules
        run: python3 Scripts/run_companion_tests.py
      - name: Check undefined behavior in companion rules
        run: python3 Scripts/run_companion_tests.py --sanitize
      - name: Check tracked whitespace
        run: git diff --check HEAD
      - name: Compile and run player-control rules
        run: python3 Scripts/run_player_control_tests.py
      - name: Check undefined behavior in player-control rules
        run: python3 Scripts/run_player_control_tests.py --sanitize
      - name: Compile and run chapter and story rules
        run: python3 Scripts/run_story_tests.py
      - name: Check undefined behavior in story rules
        run: python3 Scripts/run_story_tests.py --sanitize
      - name: Compile and run level layout and route rules
        run: python3 Scripts/run_level_layout_tests.py
      - name: Check undefined behavior in level layout rules
        run: python3 Scripts/run_level_layout_tests.py --sanitize
      - name: Compile and run enemy tactics
        run: python3 Scripts/run_enemy_tactics_tests.py
      - name: Check undefined behavior in enemy tactics
        run: python3 Scripts/run_enemy_tactics_tests.py --sanitize
      - name: Verify original audio source integrity
        run: python3 Scripts/generate_audio_sources.py --check
      - name: Compile and run local profile rules
        run: python3 Scripts/run_profile_tests.py
      - name: Check undefined behavior in local profile rules
        run: python3 Scripts/run_profile_tests.py --sanitize
